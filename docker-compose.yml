services:
  db:
    image: postgres:16-alpine
    container_name: tenantsea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tenantsea
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: tenantsea-api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      NODE_ENV: development
      PORT: 3100
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tenantsea?schema=public
      JWT_SECRET: change_me_to_a_long_random_secret_at_least_16_chars
      JWT_EXPIRES_IN: 3600s
      BCRYPT_SALT_ROUNDS: 10
      CORS_ORIGINS: ''
    ports:
      - '3100:3100'

volumes:
  postgres_data:
